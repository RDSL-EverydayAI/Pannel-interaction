<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆桌会谈 - 观众互动</title>
    <script src="https://lf26-cdn-tos.bytecdntp.com/cdn/expire-1-M/mqtt/4.2.6/mqtt.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f5f7; margin: 0; }
        .container { max-width: 400px; margin: 20px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); box-sizing: border-box; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 5px; color: white; font-size: 16px; cursor: pointer; margin-bottom: 10px; font-weight: bold; }
        .btn-send { background-color: #0052cc; }
        .btn-like { background-color: #ff5630; }
        .status { text-align: center; color: #666; font-size: 12px; margin-bottom: 15px; }
        .toast { display: none; text-align: center; color: #36b37e; font-size: 14px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div id="status" class="status">正在连接互动服务器...</div>
        
        <div class="form-group">
            <label for="userName">您的姓名：</label>
            <input type="text" id="userName" placeholder="请输入姓名（必填）">
        </div>
        <div class="form-group">
            <label for="message">弹幕内容：</label>
            <input type="text" id="message" placeholder="想对嘉宾说什么？">
        </div>
        <button class="btn-send" id="sendBtn" disabled>发送弹幕</button>
        <button class="btn-like" id="likeBtn" disabled>👍 给嘉宾点赞</button>
        <div id="toast" class="toast">发送成功！</div>
    </div>

    <script>
        // ⚠️ 核心配置：定义一个全网唯一的频道名称（建议加入公司名和随机字符，防止被别人蹭频道）
        const TOPIC = "your_company/2026/roundtable_meeting_xyz";
        
        // 连接 EMQX 国内公共 WebSocket 服务器
        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

        const statusDiv = document.getElementById('status');
        const sendBtn = document.getElementById('sendBtn');
        const likeBtn = document.getElementById('likeBtn');
        const userNameInput = document.getElementById('userName');
        const messageInput = document.getElementById('message');
        const toast = document.getElementById('toast');

        // 连接成功回调
        client.on('connect', () => {
            statusDiv.innerText = "🟢 已成功连接互动现场";
            statusDiv.style.color = "green";
            sendBtn.disabled = false;
            likeBtn.disabled = false;
        });

        client.on('error', (err) => {
            statusDiv.innerText = "🔴 连接失败，请检查网络";
            statusDiv.style.color = "red";
        });

        function showToast(text) {
            toast.innerText = text;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 1500);
        }

        // 发送通用消息函数
        function publishMessage(type, payload) {
            const data = {
                type: type,
                name: userNameInput.value.trim() || '匿名观众',
                ...payload,
                timestamp: Date.now()
            };
            // 发布到指定频道
            client.publish(TOPIC, JSON.stringify(data));
        }

        // 弹幕按钮点击
        sendBtn.addEventListener('click', () => {
            const text = messageInput.value.trim();
            if (!text) { alert('弹幕内容不能为空！'); return; }
            
            publishMessage('danmaku', { text: text });
            messageInput.value = '';
            showToast('弹幕发射成功！');
        });

        // 点赞按钮点击
        likeBtn.addEventListener('click', () => {
            publishMessage('like', {});
            showToast('点赞 +1');
        });
    </script>
</body>
</html>
