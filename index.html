<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2026 罗氏诊断中国 超有AI Day - 互动点赞</title>
    <script src="supabase.js"></script>
    <style>
        :root {
            --roche-blue: #0052cc;
            --roche-light-blue: #00b8d9;
            --like-red: #ff5630;
        }

        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0a0f1d; /* 极深底色兜底 */
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* ✨ 优化1：全屏背景采用 KV 深度模糊，形成极其高级的流光背景，彻底告别黑块 */
        .bg-blur-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            background: url('kv.jpg') no-repeat center center;
            background-size: cover;
            filter: blur(40px); /* 深度模糊 */
            transform: scale(1.1); /* 放大一点防止边缘发白 */
            opacity: 0.45; /* 降低透明度，柔和不刺眼 */
        }

        /* 互动卡片窗口 */
        .container { 
            position: relative;
            z-index: 10; 
            width: 88%;
            max-width: 350px; 
            background: rgba(255, 255, 255, 0.9); /* 高级半透明白 */
            border-radius: 24px; /* 优雅的大圆角 */
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); 
            box-sizing: border-box; 
            overflow: hidden; /* 🌟 极其关键：切掉顶部图片的直角，使其完美融入卡片圆角 */
        }

        /* ✨ 优化2：将 KV 融入窗口顶部，作为完美的横幅 Banner */
        .kv-banner {
            width: 100%;
            padding-top: 56.25%; /* 保持 16:9 的标准黄金比例，任何手机看都绝不变形 */
            background: url('kv.jpg') no-repeat center center;
            background-size: cover;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        /* 表单内容区 */
        .content-box {
            padding: 25px 22px;
            text-align: center;
        }
        
        /* 活动标题 */
        .activity-title { 
            font-size: 18px; 
            font-weight: 800; 
            line-height: 1.4; 
            margin: 0 0 25px 0;
            background: linear-gradient(to right, var(--roche-blue), var(--roche-light-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .form-group { margin-bottom: 25px; text-align: left;}
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; font-size: 14px; padding-left: 2px;}
        
        input[type="text"] { 
            width: 100%; 
            padding: 14px; 
            border: 1px solid #dfe1e6; 
            border-radius: 12px; 
            box-sizing: border-box; 
            font-size: 16px; 
            background-color: #f7f8fa; 
            transition: all 0.3s ease;
            color: #333;
            -webkit-appearance: none; 
        }
        input[type="text"]:focus { 
            border-color: var(--roche-blue); 
            background-color: #fff; 
            outline: none; 
        }
        input[type="text"]::placeholder { color: #aaa; font-size: 14px; }
        
        /* 点赞按钮 */
        .btn-like { 
            width: 100%; 
            padding: 15px; 
            border: none; 
            border-radius: 50px; 
            color: white; 
            font-size: 18px; 
            cursor: pointer; 
            font-weight: bold; 
            background: linear-gradient(45deg, var(--like-red), #ff8f6d);
            box-shadow: 0 6px 18px rgba(255, 86, 48, 0.3);
            transition: all 0.2s ease; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            -webkit-tap-highlight-color: transparent; 
        }
        .btn-like:active { transform: scale(0.96); box-shadow: 0 3px 8px rgba(255, 86, 48, 0.2); }
        .btn-like:disabled { background: #bbb !important; box-shadow: none; cursor: not-allowed; opacity: 0.8;}
        
        .heart-icon { font-size: 20px; }
        .toast { display: none; text-align: center; color: #36b37e; font-size: 14px; margin-top: 12px; font-weight: bold;}
    </style>
</head>
<body>
    <div class="bg-blur-layer"></div>

    <div class="container">
        <div class="kv-banner"></div>

        <div class="content-box">
            <div class="activity-title">2026 罗氏诊断中国<br>超有AI Day 圆桌会谈</div>
            
            <div class="form-group">
                <label for="userName">输入您的姓名参与互动：</label>
                <input type="text" id="userName" placeholder="点击输入（可选）" maxlength="10">
            </div>
            
            <button class="btn-like" id="likeBtn" disabled>
                正在连接...
            </button>
            <div id="toast" class="toast">❤️ 点赞成功！</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://arvpflsuvqdlqejjpxig.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_SNXV6FFgIQ-glva5p_nV1w_hQQQelFS";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const channel = supabaseClient.channel('meeting-room', {
            config: { broadcast: { self: true } }
        });

        const likeBtn = document.getElementById('likeBtn');
        const userNameInput = document.getElementById('userName');
        const toast = document.getElementById('toast');

        if(localStorage.getItem('roche_user_name')){
            userNameInput.value = localStorage.getItem('roche_user_name');
        }

        channel.subscribe((status) => {
            if (status === 'SUBSCRIBED') {
                likeBtn.disabled = false;
                likeBtn.innerHTML = '<span class="heart-icon">❤️</span> 给嘉宾点赞';
            } else {
                likeBtn.disabled = true;
                likeBtn.innerText = '连接中...';
            }
        });

        function showToast(text) {
            toast.innerText = text;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 1500);
        }

        function sendInteraction(eventType, customPayload = {}) {
            const name = userNameInput.value.trim() || '热心观众';
            if(userNameInput.value.trim()){
                localStorage.setItem('roche_user_name', userNameInput.value.trim());
            }
            
            channel.send({
                type: 'broadcast',
                event: eventType,
                payload: {
                    name: name,
                    ...customPayload,
                    timestamp: Date.now()
                }
            });
        }

        likeBtn.addEventListener('click', () => {
            sendInteraction('like');
            showToast('❤️ 点赞成功！');
            likeBtn.style.transform = 'scale(0.95)';
            setTimeout(()=> likeBtn.style.transform = 'scale(1)', 100);
        });
    </script>
</body>
</html>
