<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 罗氏诊断中国 超有AI Day - 大屏互动</title>
    <script src="supabase.js"></script>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            /* 🔗 确保同一目录下有 kv.jpg */
            background: #111 url('kv.jpg') no-repeat center center fixed; 
            background-size: cover; 
        }
        
        /* 🛠️ 核心更新：累计点赞计数器调整至右下角 */
        #like-counter-container {
            position: absolute;
            bottom: 40px; /* 距离底部 40px */
            right: 40px;  /* 距离右侧 40px */
            z-index: 100; /* 确保在最上层显示 */
            background: rgba(0, 0, 0, 0.6); /* 稍微加深半透明背景，确保右下角看得很清晰 */
            padding: 15px 25px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #like-counter-label {
            font-size: 18px;
            font-weight: bold;
            color: rgba(255,255,255,0.8);
            letter-spacing: 1px;
        }

        #like-counter {
            font-size: 48px;
            font-weight: 900;
            color: #ff5630; 
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-shadow: 0 0 15px rgba(255, 86, 48, 0.7);
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0% { text-shadow: 0 0 10px rgba(255, 86, 48, 0.5); }
            50% { text-shadow: 0 0 25px rgba(255, 86, 48, 0.9); transform: scale(1.02); }
            100% { text-shadow: 0 0 10px rgba(255, 86, 48, 0.5); }
        }
        
        /* 弹幕轨道容器 */
        #danmaku-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 55vh; pointer-events: none; z-index: 10;
        }

        .danmaku-item {
            position: absolute; white-space: nowrap; font-size: 38px; font-weight: bold;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
            animation: fly-left linear forwards;
        }
        @keyframes fly-left {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }

        /* 点赞容器 */
        #like-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 5;
        }

        /* 点赞气泡样式与全屏升空动画 */
        .like-item {
            position: absolute; 
            bottom: -60px; 
            padding: 10px 22px; 
            border-radius: 30px; 
            font-size: 24px; 
            white-space: nowrap; 
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            animation: float-up-dynamic ease-out forwards;
        }
        @keyframes float-up-dynamic {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            10% { opacity: 1; transform: translateY(-100px) scale(1.1); }
            85% { opacity: 1; }
            100% { transform: translateY(-95vh) scale(0.85); opacity: 0; } 
        }
    </style>
</head>
<body>
    <div id="like-counter-container">
        <div id="like-counter-label">累计点赞</div>
        <div id="like-counter">0</div>
    </div>

    <div id="danmaku-container"></div>
    <div id="like-container"></div>

    <script>
        const SUPABASE_URL = "https://arvpflsuvqdlqejjpxig.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_SNXV6FFgIQ-glva5p_nV1w_hQQQelFS";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const danmakuContainer = document.getElementById('danmaku-container');
        const likeContainer = document.getElementById('like-container');
        
        let totalLikes = 0;
        const likeCounterEl = document.getElementById('like-counter');

        const emojis = ['❤️', '👍', '🔥', '✨', '🎉', '🚀', '🌟', '👏', '🥳', '⚡', '💡', '🌈'];
        const gradients = [
            'linear-gradient(45deg, #ff5630, #ffab00)', 
            'linear-gradient(45deg, #36b37e, #00b8d9)', 
            'linear-gradient(45deg, #0052cc, #00b8d9)', 
            'linear-gradient(45deg, #6554c0, #ff5630)'  
        ];

        supabaseClient
            .channel('meeting-room')
            .on('broadcast', { event: 'danmaku' }, (response) => {
                createDanmaku(response.payload.name, response.payload.text);
            })
            .on('broadcast', { event: 'like' }, (response) => {
                createLike(response.payload.name);
                
                // 收到点赞消息，计数器增加并格式化展示
                totalLikes++;
                likeCounterEl.innerText = totalLikes.toLocaleString(); 
                
                // 数字实时跳动特效
                likeCounterEl.style.animation = 'none';
                likeCounterEl.offsetHeight; 
                likeCounterEl.style.animation = 'pulse-red 0.5s ease-out'; 
                setTimeout(()=>{
                    likeCounterEl.style.animation = 'pulse-red 2s infinite'; 
                }, 500);
            })
            .subscribe();

        function createDanmaku(name, text) {
            const div = document.createElement('div');
            div.className = 'danmaku-item';
            div.innerText = `${name}：${text}`;
            const topPosition = Math.random() * 80 + 5; 
            div.style.top = `${topPosition}%`;
            const colors = ['#FFF', '#FFD700', '#00FA9A', '#87CEFA', '#FF69B4', '#00FFFF'];
            div.style.color = colors[Math.floor(Math.random() * colors.length)];
            const duration = Math.random() * 3 + 7;
            div.style.animationDuration = `${duration}s`;
            danmakuContainer.appendChild(div);
            setTimeout(() => { div.remove(); }, duration * 1000);
        }

        function createLike(name) {
            const div = document.createElement('div');
            div.className = 'like-item';
            const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
            const randomGradient = gradients[Math.floor(Math.random() * gradients.length)];
            div.innerText = `${randomEmoji} ${name}`;
            div.style.background = randomGradient;
            
            // 🛠️ 优化：将随机范围限制在 5% 到 75% 之间，特意让出右下角区域给计数器
            const randomLeft = Math.random() * 70 + 5;
            div.style.left = `${randomLeft}%`;
            
            const duration = Math.random() * 1.5 + 3; 
            div.style.animationDuration = `${duration}s`;
            likeContainer.appendChild(div);
            setTimeout(() => { div.remove(); }, duration * 1000);
        }
    </script>
</body>
</html>
